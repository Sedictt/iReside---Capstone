<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iReside Defense Command & Walkthrough Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFF9EB;
      --ink: #1E2430;
      --ink-soft: #5A6578;
      --outline: #1E2430;

      --white: #FFFFFF;
      --cream: #FFF4D6;

      --green: #22C55E;
      --green-dark: #15803D;
      --green-light: #DCFCE7;

      --blue: #38BDF8;
      --blue-dark: #0284C7;
      --blue-light: #E0F2FE;

      --yellow: #FACC15;
      --yellow-dark: #CA8A04;
      --yellow-light: #FEF9C3;

      --orange: #FB923C;
      --orange-dark: #C2410C;
      --orange-light: #FFEDD5;

      --pink: #F472B6;
      --pink-dark: #BE185D;
      --pink-light: #FCE7F3;

      --purple: #A855F7;
      --purple-light: #F3E8FF;

      --red: #EF4444;
      --red-light: #FEE2E2;

      --font-display: 'Fredoka', sans-serif;
      --font-body: 'Nunito', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      background-image: radial-gradient(#E5D9BC 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
       flex-direction: column;
      align-items: center;
      padding: 14px 16px 32px;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    /* Main Toy-Board Container */
    .board {
      width: 100%;
      max-width: 1040px;
      background: var(--white);
      border: 3px solid var(--outline);
      border-radius: 24px;
      box-shadow: 0 8px 0 var(--outline);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Command Header Bar */
    .top-cmd-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 2.5px dashed #CBD5E1;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 14px;
      border: 2.5px solid var(--outline);
      background: var(--white);
      box-shadow: 0 4px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    .mode-tab:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 var(--outline);
    }

    .mode-tab.active {
      background: var(--ink);
      color: var(--yellow);
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--outline);
    }

    .mode-tab.curveball.active {
      background: var(--orange);
      color: var(--white);
    }

    .mode-tab.tools.active {
      background: var(--purple);
      color: var(--white);
    }

    /* Active Session Status Pill + Quick Drawer Toggle */
    .session-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2px solid var(--outline);
      background: var(--green-light);
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .session-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--green);
      border: 1.5px solid var(--outline);
    }

    .quick-bar-toggle {
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid var(--outline);
      background: var(--yellow-light);
      box-shadow: 0 3px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .quick-bar-toggle:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--outline);
    }

    /* 1-Click Account Switcher Strip */
    .acct-strip {
      background: #F8FAFC;
      border: 2.5px solid var(--outline);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .acct-strip.hidden {
      display: none;
    }

    .acct-strip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .acct-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .acct-chip-group {
      display: inline-flex;
      align-items: stretch;
      border: 2px solid var(--outline);
      border-radius: 11px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 3px 0 var(--outline);
      transition: transform 80ms ease;
    }

    .acct-chip-group:hover {
      transform: translateY(-1px);
    }

    .acct-chip-group.current {
      background: var(--green-light);
      border-color: var(--green-dark);
    }

    .acct-btn {
      padding: 5px 9px;
      border: none;
      background: transparent;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-align: left;
    }

    .acct-btn:hover {
      background: var(--yellow-light);
    }

    .acct-copy-email {
      padding: 5px 7px;
      border: none;
      border-left: 1.5px solid var(--outline);
      background: var(--cream);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      title: "Copy Email";
    }

    .acct-copy-email:hover {
      background: var(--yellow);
    }

    /* 1. Chunky Module Picker Pills */
    .mod-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mod-pill {
      flex: 1;
      min-width: 118px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 8px;
      border-radius: 14px;
      border: 2.5px solid var(--outline);
      background: var(--cream);
      box-shadow: 0 4px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    .mod-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 var(--outline);
    }

    .mod-pill:active,
    .mod-pill.active {
      background: var(--yellow);
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--outline);
    }

    .mod-pill.curveball-pill {
      background: #FFF7ED;
      flex: 1 1 calc(20% - 6px);
      min-width: 165px;
      justify-content: flex-start;
      padding: 8px 10px;
    }

    .mod-pill.curveball-pill.active {
      background: var(--orange);
      color: var(--white);
    }

    .mod-badge {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      border: 2px solid var(--outline);
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 2. Visual Step-by-Step Toy Train Flowchart */
    .flow-tray {
      background: var(--blue-light);
      border: 3px solid var(--outline);
      border-radius: 18px;
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.8), 0 4px 0 var(--outline);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-bubble {
      flex: 1;
      min-width: 125px;
      background: var(--white);
      border: 2.5px solid var(--outline);
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--outline);
      padding: 9px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    .step-bubble:hover {
      transform: translateY(-1px);
    }

    .step-bubble.active {
      background: var(--green);
      color: var(--white);
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--outline);
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--ink);
      border: 2px solid var(--outline);
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-bubble.active .step-circle {
      background: var(--white);
      color: var(--ink);
    }

    .step-bubble-text {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.15;
    }

    .flow-arrow {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--ink);
      user-select: none;
    }

    /* 3. Compact Main Action Card */
    .play-card {
      background: var(--cream);
      border: 3px solid var(--outline);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--outline);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .play-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .play-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .big-num {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--orange);
      color: var(--white);
      border: 2.5px solid var(--outline);
      box-shadow: 0 3px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .play-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .tags-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .where-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--white);
      border: 2px solid var(--outline);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .actor-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--purple-light);
      border: 2px solid var(--outline);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 12px;
      background: var(--blue);
      color: var(--ink);
      border: 2.5px solid var(--outline);
      box-shadow: 0 4px 0 var(--outline);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: transform 100ms ease, box-shadow 100ms ease;
    }

    .open-btn.auto-login {
      background: var(--green);
      color: var(--white);
    }

    .open-btn.reset-mini {
      background: var(--yellow);
      color: var(--ink);
    }

    .open-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 var(--outline);
    }

    .open-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--outline);
    }

    /* Spoken Taglish Cue Banner */
    .say-banner {
      background: var(--white);
      border: 2px solid var(--outline);
      border-left: 6px solid var(--orange);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .say-label {
      background: var(--orange-light);
      border: 1.5px solid var(--outline);
      border-radius: 6px;
      padding: 1px 6px;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* Two Compact Toy Blocks: CLICK + COPY */
    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .block {
      background: var(--white);
      border: 2.5px solid var(--outline);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--outline);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .block-heading {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .click-steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .click-steps li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--yellow-light);
      border: 2px solid var(--outline);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .mini-num {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--yellow);
      border: 2px solid var(--outline);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-word {
      background: var(--green-light);
      border: 1.5px solid var(--outline);
      padding: 1px 7px;
      border-radius: 6px;
      font-family: var(--font-display);
      font-weight: 700;
    }

    /* Copy Toys */
    .copy-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .copy-toy {
      width: 100%;
      background: var(--pink-light);
      border: 2.5px solid var(--outline);
      border-radius: 12px;
      box-shadow: 0 3px 0 var(--outline);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    .copy-toy:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--outline);
    }

    .copy-toy:active,
    .copy-toy.copied {
      background: var(--green-light);
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--outline);
    }

    .copy-info {
      min-width: 0;
      flex: 1;
    }

    .copy-label {
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .copy-val {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .copy-badge {
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--green);
      color: var(--white);
      border: 2px solid var(--outline);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .empty-toy {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-light);
      border: 2px dashed var(--outline);
      border-radius: 12px;
      padding: 16px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
    }

    /* Bottom Chunky Back / Next Buttons */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .big-btn {
      padding: 10px 20px;
      border-radius: 14px;
      border: 2.5px solid var(--outline);
      background: var(--white);
      box-shadow: 0 4px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      transition: transform 100ms ease, box-shadow 100ms ease;
    }

    .big-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 var(--outline);
    }

    .big-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--outline);
    }

    .big-btn.next {
      background: var(--green);
      color: var(--white);
    }

    .big-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Mode 3: Emergency & Quick Jump Tools Grid */
    .tools-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 12px;
    }

    .tool-card {
      background: var(--white);
      border: 2.5px solid var(--outline);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--outline);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .tool-card-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-card-desc {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink-soft);
      line-height: 1.35;
    }

    .tool-btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-action-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 11px;
      border: 2px solid var(--outline);
      background: var(--yellow);
      box-shadow: 0 3px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .tool-action-btn.green {
      background: var(--green);
      color: var(--white);
    }

    .tool-action-btn.blue {
      background: var(--blue);
      color: var(--ink);
    }

    .tool-action-btn.red {
      background: var(--red-light);
      color: #B91C1C;
    }

    .tool-action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--outline);
    }

    .tool-input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 10px;
      border: 2px solid var(--outline);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* Quick Route Matrix */
    .route-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 8px;
    }

    .route-btn {
      padding: 8px 10px;
      border-radius: 12px;
      border: 2px solid var(--outline);
      background: var(--cream);
      box-shadow: 0 3px 0 var(--outline);
      font-family: var(--font-display);
      font-size: 0.84rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--ink);
    }

    .route-btn:hover {
      background: var(--yellow);
    }

    /* Toast Banner */
    .toast-banner {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 999;
      background: var(--ink);
      color: var(--yellow);
      border: 3px solid var(--outline);
      border-radius: 14px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.25);
      padding: 10px 16px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      display: none;
      max-width: 420px;
    }

    .toast-banner.show {
      display: block;
    }

    @media (max-width: 720px) {
      .two-cols {
        grid-template-columns: 1fr;
      }
      .flow-tray {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <main class="board">
    <!-- TOP COMMAND BAR: Mode Switcher + Active Account Status -->
    <header class="top-cmd-bar">
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" id="tab-main">🎯 Main 7-Feature Demo</button>

      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 3200);
    }

    function resolveDynamicValue(val) {
      if (!val) return val;
      return val.replace(/__KATRINA_LINK__/g, liveKatrinaLink);
    }

    // Fetch current session & live IDs from /api/demo-console/actions
    async function refreshLiveState() {
      try {
        const res = await fetch(`${APP_ORIGIN}/api/demo-console/actions`);
        const data = await res.json();
        if (data.ok) {
          currentUserEmail = data.currentUser?.email || null;
          if (data.demoIds?.links?.katrina_signing_link) {
            liveKatrinaLink = data.demoIds.links.katrina_signing_link;
          }
          updateSessionBadge(data.currentUser);
          renderAccountStrip();
          if (activeMode !== "tools") renderWalkthrough();
        }
      } catch {
        sessionLabelEl.textContent = "Local Guide Ready";
      }
    }

    function updateSessionBadge(user) {
      if (!user || !user.email) {
        sessionLabelEl.textContent = "Signed Out (Public Mode)";
        return;
      }
      const matched = ACCOUNTS.find(a => a.email && a.email.toLowerCase() === user.email.toLowerCase());
      sessionLabelEl.textContent = matched
        ? `Active: ${matched.short}`
        : `Active: ${user.email} (${user.role})`;
    }

    // Switch account via backend API & optionally open target URL
    async function switchAccountAndOpen(acctKey, customTargetUrl, openTab = true) {
      const acct = ACCOUNT_BY_KEY[acctKey];
      if (!acct) return;

      showToast(`⏳ Switching to ${acct.short}…`);
      try {
        // Clear or set localStorage onboarding flags for clean transitions
        if (acct.key === "starter") {
          localStorage.removeItem("ireside.onboarding_completed");
          localStorage.removeItem("ireside_setup_completed");
        } else if (acct.key === "landlord") {
          localStorage.setItem("ireside.onboarding_completed", "true");
          localStorage.setItem("ireside_setup_completed", "true");
        }

        const res = await fetch(`${APP_ORIGIN}/api/demo-console/actions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "switch-account",
            email: acct.email,
            password: acct.pass
          })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Login failed");

        currentUserEmail = acct.email;
        updateSessionBadge(data.user);
        renderAccountStrip();

        const dest = resolveDynamicValue(customTargetUrl || `${APP_ORIGIN}${acct.url}`);
        showToast(`✅ Logged in as ${acct.short}!`);
        if (openTab) {
          window.open(dest, "_blank", "noopener");
        }
      } catch (err) {
        showToast(`⚠️ Auto-switch error: ${err.message}`);
      }
    }

    // Run backend reset/utility action
    async function runBackendAction(actionType, extraPayload = {}) {
      showToast(`⏳ Running ${actionType}…`);
      try {
        const res = await fetch(`${APP_ORIGIN}/api/demo-console/actions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: actionType, ...extraPayload })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Action failed");

        if (data.signingLink) {
          liveKatrinaLink = data.signingLink;
        }
        if (data.demoIds?.links?.katrina_signing_link) {
          liveKatrinaLink = data.demoIds.links.katrina_signing_link;
        }

        showToast(`✅ ${data.message || `Completed (${data.seconds ?? 1}s)`}`);
        await refreshLiveState();
        return data;
      } catch (err) {
        showToast(`✗ Error: ${err.message}`);
        return null;
      }
    }

    function renderAccountStrip() {
      acctGridEl.innerHTML = ACCOUNTS.map(a => {
        const isCurrent = (a.email && currentUserEmail && a.email.toLowerCase() === currentUserEmail.toLowerCase()) || (!a.email && !currentUserEmail);
        return `
          <div class="acct-chip-group ${isCurrent ? "current" : ""}">
            <button type="button" class="acct-btn" data-switch-acct="${a.key}" title="${a.note}">
              <span>${a.short}</span>
            </button>
            ${a.email ? `<button type="button" class="acct-copy-email" data-raw-copy="${a.email}" title="Copy ${a.email}">📋</button>` : ""}
          </div>
        `;
      }).join("");

      acctGridEl.querySelectorAll("[data-switch-acct]").forEach(btn => {
        btn.addEventListener("click", () => {
          const k = btn.getAttribute("data-switch-acct");
          switchAccountAndOpen(k, null, true);
        });
      });

      document.querySelectorAll("[data-raw-copy]").forEach(btn => {
        btn.onclick = () => {
          const val = btn.getAttribute("data-raw-copy");
          navigator.clipboard.writeText(val).catch(() => {});
          showToast(`📋 Copied: ${val}`);
        };
      });
    }

    function getActiveModules() {
      return activeMode === "curveballs" ? CURVEBALL_MODULES : MAIN_MODULES;
    }

    function renderWalkthrough() {
      const modules = getActiveModules();
      if (modIdx >= modules.length) modIdx = 0;
      const mod = modules[modIdx];
      if (stepIdx >= mod.steps.length) stepIdx = 0;
      const step = mod.steps[stepIdx];

      // 1. Module Pills
      modBarEl.innerHTML = modules.map((m, i) => `
        <button type="button" class="mod-pill ${activeMode === "curveballs" ? "curveball-pill" : ""} ${i === modIdx ? "active" : ""}" data-mod="${i}">
          <span class="mod-badge">${m.num}</span>
          <span>${m.name}</span>
        </button>
      `).join("");

      modBarEl.querySelectorAll("[data-mod]").forEach((b) => {
        b.addEventListener("click", () => {
          modIdx = Number(b.getAttribute("data-mod"));
          stepIdx = 0;
          renderWalkthrough();
        });
      });

      // 2. Flowchart Bubbles
      flowTrayEl.innerHTML = mod.steps.map((s, i) => `
        <button type="button" class="step-bubble ${i === stepIdx ? "active" : ""}" data-step="${i}">
          <span class="step-circle">${i + 1}</span>
          <span class="step-bubble-text">${s.short}</span>
        </button>
        ${i < mod.steps.length - 1 ? `<span class="flow-arrow">➜</span>` : ""}
      `).join("");

      flowTrayEl.querySelectorAll("[data-step]").forEach((b) => {
        b.addEventListener("click", () => {
          stepIdx = Number(b.getAttribute("data-step"));
          renderWalkthrough();
        });
      });

      // 3. Play Card
      const stepUrl = resolveDynamicValue(step.url);
      const actor = step.as ? ACCOUNT_BY_KEY[step.as] : null;

      const clicksHtml = step.clicks.map((c, i) => `
        <li>
          <span class="mini-num">${i + 1}</span>
          <span>${c}</span>
        </li>
      `).join("");

      const resolvedCopies = (step.copies || []).map(cp => ({
        label: cp.label,
        value: resolveDynamicValue(cp.value)
      }));

      const copiesHtml = resolvedCopies.length > 0
        ? `<div class="copy-list">
            ${resolvedCopies.map((cp) => `
              <button type="button" class="copy-toy" data-copy="${cp.value.replace(/"/g, "&quot;")}">
                <div class="copy-info">
                  <div class="copy-label">${cp.label}</div>
                  <div class="copy-val">${cp.value}</div>
                </div>
                <span class="copy-badge">COPY</span>
              </button>
            `).join("")}
           </div>`
        : `<div class="empty-toy">Nothing to type — just click!</div>`;

      const isFirst = modIdx === 0 && stepIdx === 0;
      const isLast = modIdx === modules.length - 1 && stepIdx === mod.steps.length - 1;

      const nextText = stepIdx < mod.steps.length - 1
        ? `Next: Step ${stepIdx + 2} ➜`
        : modIdx < modules.length - 1
          ? `Next: ${modules[modIdx + 1].name} ➜`
          : `All Done!`;

      const resetBtnHtml = step.resetAction
        ? `<button type="button" class="open-btn reset-mini" id="step-reset-btn">${step.resetLabel || "🔄 Reset Step"}</button>`
        : "";

      const autoLoginBtnHtml = actor
        ? `<button type="button" class="open-btn auto-login" id="step-autologin-btn">⚡ Login as ${actor.short} &amp; Open ↗</button>`
        : "";

      playCardEl.innerHTML = `
        <div class="play-header">
          <div class="play-title-group">
            <div class="big-num">${stepIdx + 1}</div>
            <div>
              <h1 class="play-title">${step.title}</h1>
              <div class="tags-row">
                <span class="where-tag">Screen: ${step.where}</span>
                ${actor ? `<span class="actor-tag">Role: ${actor.short}</span>` : ""}
              </div>
            </div>
          </div>
          <div class="action-btns">
            ${resetBtnHtml}
            ${autoLoginBtnHtml}
            <a href="${stepUrl}" target="_blank" rel="noopener" class="open-btn">Open Page Only ↗</a>
          </div>
        </div>

        ${step.say ? `
          <div class="say-banner">
            <span class="say-label">🎙️ Say</span>
            <span>"${step.say}"</span>
          </div>
        ` : ""}

        <div class="two-cols">
          <div class="block">
            <div class="block-heading">1. Click This</div>
            <ul class="click-steps">${clicksHtml}</ul>
          </div>

          <div class="block">
            <div class="block-heading">2. Copy &amp; Paste This</div>
            ${copiesHtml}
          </div>
        </div>

        <div class="footer-bar">
          <button type="button" class="big-btn" id="prev-btn" ${isFirst ? "disabled" : ""}>⬅ Back</button>
          <button type="button" class="big-btn next" id="next-btn" ${isLast ? "disabled" : ""}>${nextText}</button>
        </div>
      `;

      playCardEl.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const val = btn.getAttribute("data-copy");
          navigator.clipboard.writeText(val).catch(() => {});
          const badge = btn.querySelector(".copy-badge");
          btn.classList.add("copied");
          badge.textContent = "COPIED!";
          setTimeout(() => {
            btn.classList.remove("copied");
            badge.textContent = "COPY";
          }, 900);
        });
      });

      const autoBtn = document.getElementById("step-autologin-btn");
      if (autoBtn && actor) {
        autoBtn.addEventListener("click", () => {
          switchAccountAndOpen(actor.key, stepUrl, true);
        });
      }

      const resetBtn = document.getElementById("step-reset-btn");
      if (resetBtn && step.resetAction) {
        resetBtn.addEventListener("click", () => {
          if (step.resetAction === "delete-marco") {
            runBackendAction("delete-user", { email: "marco.reyes2026@gmail.com" });
          } else {
            runBackendAction(step.resetAction);
          }
        });
      }

      document.getElementById("prev-btn").addEventListener("click", prev);
      document.getElementById("next-btn").addEventListener("click", next);
    }

    function renderToolsPanel() {
      toolsViewEl.innerHTML = `
        <div class="play-card" style="background:var(--blue-light);">
          <div class="play-header">
            <div>
              <h2 class="play-title">🛠️ Live Emergency Controls &amp; Instant Resets</h2>
              <p style="font-size:0.88rem; font-weight:800; color:var(--ink-soft); margin-top:2px;">
                Use these 1-click tools if the panel asks you to repeat a demo, create a brand-new account, or reset the database.
              </p>
            </div>
          </div>

          <div class="tools-grid">
            <div class="tool-card">
              <div>
                <div class="tool-card-title">✍️ Reset Katrina's Lease Signing (&lt;1s)</div>
                <p class="tool-card-desc">Restores Katrina's Room 201 lease back to <b>Pending Tenant Signature</b> and generates a fresh 30-day JWT signing link immediately.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn green" id="tool-reset-katrina">🔄 Reset Katrina Lease Now</button>
                <button type="button" class="tool-action-btn" id="tool-copy-katrina">📋 Copy Signing Link</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">💳 Reset Joshua's GCash Bills (&lt;1s)</div>
                <p class="tool-card-desc">Restores Joshua's Nov 2026 bill to <b>Pay Now (₱5,709.50)</b> for Tenant and Oct 2026 bill to <b>To Verify</b> for Landlord.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn green" id="tool-reset-joshua">🔄 Reset Joshua Bills Now</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">🌱 Fresh Landlord Account (5-Stage Setup)</div>
                <p class="tool-card-desc">Wipes <code>practice.landlord1@ireside.ph</code> (<code>LandlordDemo2026!</code>) to 0 properties so you can demo New Landlord Onboarding live.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn green" id="tool-starter-setup">⚡ Ready for /setup (Skip OTP)</button>
                <button type="button" class="tool-action-btn" id="tool-starter-unclaimed">🔐 Unclaimed (Show OTP Claim)</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">➕ Generate Brand-New Landlord</div>
                <p class="tool-card-desc">Creates a brand-new <code>practice.landlordN@ireside.ph</code> account without touching any existing accounts.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn blue" id="tool-create-landlord">✨ Provision New Landlord</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">🧭 Reset New Tenant Guided Tour</div>
                <p class="tool-card-desc">Resets Mark Lim (Room 301) back to his first-time login state so the Tenant Guided Product Tour launches automatically.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn blue" id="tool-reset-tour">🔄 Reset Mark's Tour &amp; Login</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">🔔 Push Unread Notifications</div>
                <p class="tool-card-desc">Inserts fresh unread notifications for both Landlord (John) and Tenant (Joshua) so the notification bell lights up live.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn" id="tool-push-notif">🔔 Trigger Live Notifications</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">🧹 Delete / Purge Test Email or Account</div>
                <p class="tool-card-desc">Deletes a test applicant or user (e.g. <code>marco.reyes2026@gmail.com</code>) so you can re-register that email cleanly.</p>
              </div>
              <div class="tool-btn-row">
                <input type="text" class="tool-input" id="purge-email-input" value="marco.reyes2026@gmail.com" />
                <button type="button" class="tool-action-btn red" id="tool-purge-user" style="flex:0 0 auto;">🗑️ Purge</button>
              </div>
            </div>

            <div class="tool-card">
              <div>
                <div class="tool-card-title">🚨 Full Defense Database Reset (~20s)</div>
                <p class="tool-card-desc">Runs <code>scripts/seed-defense-demo.mjs</code> to rebuild all 24 units, 8 tenants, 140 invoices, and applications from scratch.</p>
              </div>
              <div class="tool-btn-row">
                <button type="button" class="tool-action-btn red" id="tool-full-reset">🚨 Run Full Database Seed Reset</button>
              </div>
            </div>
          </div>
        </div>

        <div class="play-card">
          <div class="play-header">
            <div>
              <h2 class="play-title">🚀 1-Click Deep-Link Matrix (Auto-Switches Role &amp; Opens Page)</h2>
              <p style="font-size:0.88rem; font-weight:800; color:var(--ink-soft); margin-top:2px;">
                Click any destination below to automatically log in as the right persona and open that page in a new tab.
              </p>
            </div>
          </div>
          <div class="route-matrix">
            ${QUICK_ROUTES.map((r, idx) => `
              <button type="button" class="route-btn" data-quick-route="${idx}">
                <span>${r.label}</span>
                <span>↗</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;

      document.getElementById("tool-reset-katrina").onclick = () => runBackendAction("quick-reset-katrina");
      document.getElementById("tool-copy-katrina").onclick = () => {
        navigator.clipboard.writeText(liveKatrinaLink).catch(() => {});
        showToast("📋 Copied live Katrina Signing Link!");
      };
      document.getElementById("tool-reset-joshua").onclick = () => runBackendAction("quick-reset-joshua-bill");
      document.getElementById("tool-starter-setup").onclick = async () => {
        const res = await runBackendAction("prepare-starter-onboarding");
        if (res && res.ok) switchAccountAndOpen("starter", `${APP_ORIGIN}/setup`, true);
      };
      document.getElementById("tool-starter-unclaimed").onclick = async () => {
        const res = await runBackendAction("reset-starter-landlord");
        if (res && res.ok) switchAccountAndOpen("public", `${APP_ORIGIN}/login`, true);
      };
      document.getElementById("tool-create-landlord").onclick = async () => {
        const res = await runBackendAction("create-fresh-landlord");
        if (res && res.email) {
          navigator.clipboard.writeText(res.email).catch(() => {});
          showToast(`✨ Created ${res.email} (Copied to clipboard! Pass: ${res.password})`);
        }
      };
      document.getElementById("tool-reset-tour").onclick = async () => {
        const res = await runBackendAction("reset-tenant-tour");
        if (res && res.ok) switchAccountAndOpen("mark", `${APP_ORIGIN}/tenant/dashboard`, true);
      };
      document.getElementById("tool-push-notif").onclick = () => runBackendAction("seed-notifications");
      document.getElementById("tool-purge-user").onclick = () => {
        const email = document.getElementById("purge-email-input").value.trim();
        if (email) runBackendAction("delete-user", { email });
      };
      document.getElementById("tool-full-reset").onclick = () => {
        if (confirm("Run full database seed reset (takes ~20 seconds)?")) {
          runBackendAction("full-reset");
        }
      };

      toolsViewEl.querySelectorAll("[data-quick-route]").forEach(btn => {
        btn.addEventListener("click", () => {
          const r = QUICK_ROUTES[Number(btn.getAttribute("data-quick-route"))];
          switchAccountAndOpen(r.as, `${APP_ORIGIN}${r.url}`, true);
        });
      });
    }

    function setMode(mode) {
      activeMode = mode;
      modIdx = 0;
      stepIdx = 0;

      document.getElementById("tab-main").classList.toggle("active", mode === "main");
      document.getElementById("tab-curveballs").classList.toggle("active", mode === "curveballs");
      document.getElementById("tab-tools").classList.toggle("active", mode === "tools");

      if (mode === "tools") {
        walkthroughViewEl.style.display = "none";
        toolsViewEl.style.display = "flex";
        renderToolsPanel();
      } else {
        walkthroughViewEl.style.display = "flex";
        toolsViewEl.style.display = "none";
        renderWalkthrough();
      }
    }

    function next() {
      if (activeMode === "tools") return;
      const modules = getActiveModules();
      const mod = modules[modIdx];
      if (stepIdx < mod.steps.length - 1) stepIdx++;
      else if (modIdx < modules.length - 1) { modIdx++; stepIdx = 0; }
      renderWalkthrough();
    }

    function prev() {
      if (activeMode === "tools") return;
      const modules = getActiveModules();
      if (stepIdx > 0) stepIdx--;
      else if (modIdx > 0) { modIdx--; stepIdx = modules[modIdx].steps.length - 1; }
      renderWalkthrough();
    }

    document.getElementById("tab-main").addEventListener("click", () => setMode("main"));
    document.getElementById("tab-curveballs").addEventListener("click", () => setMode("curveballs"));
    document.getElementById("tab-tools").addEventListener("click", () => setMode("tools"));

    document.getElementById("toggle-acct-strip").addEventListener("click", () => {
      acctStripEl.classList.toggle("hidden");
    });

    window.addEventListener("keydown", (e) => {
      if (e.target && e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    });

    renderAccountStrip();
    renderWalkthrough();
    refreshLiveState();
  </script>
</body>
</html>
